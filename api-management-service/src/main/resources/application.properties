spring.application.name=api-management-service
server.port=8081

# Application information for health endpoint
info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

# MySQL
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# SQL initialization
spring.sql.init.mode=never

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Flyway seed placeholders
spring.flyway.placeholders.super-admin-email=${GATEKEEPER_SUPER_ADMIN_EMAIL}
spring.flyway.placeholders.super-admin-password-hash=${GATEKEEPER_SUPER_ADMIN_PASSWORD_HASH}
spring.flyway.placeholders.gateway-service-email=${GATEKEEPER_GATEWAY_SERVICE_EMAIL}
spring.flyway.placeholders.gateway-service-password-hash=${GATEKEEPER_GATEWAY_SERVICE_PASSWORD_HASH}

# Kafka connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka reliability
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true

# GateKeeper application-specific Kafka topics
gatekeeper.kafka.topics.setup-invitations=${SETUP_INVITATIONS_TOPIC:gatekeeper.setup-invitations.v1}

# Invitation setup-token configuration
gatekeeper.setup-token.length=32
gatekeeper.setup-token.validity=30

# Logging defaults
logging.level.org.springframework.security=INFO
